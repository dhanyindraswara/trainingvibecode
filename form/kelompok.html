<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Kelompok — Training CHL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./">← Menu</a>
    <span class="ins">INSYNTIVE</span>
  </div>

  <p class="eyebrow">Pembagian Tim</p>
  <h1>Daftar Kelompok</h1>
  <p class="lede">Cari namamu, catat nomor kelompokmu, lalu pakai nomor itu saat mengisi Form Persiapan dan Pre-Test. 5 kelompok, dibagi per divisi.</p>

  <div class="field" style="max-width:340px;margin-bottom:22px">
    <input type="text" id="cari" placeholder="🔍 Ketik namamu untuk cari cepat…">
  </div>

  <div id="roster" class="roster"></div>

  <p class="foot">Training by INSYNTIVE · Cipta Harmoni Lestari · 2026</p>
</div>

<script>
// ============================================================
//  EDIT DI SINI — pembagian kelompok. Ubah bila perlu.
// ============================================================
const KELOMPOK = [
  { no:"1", divisi:"Proyek · Tim A", anggota:[
    { nama:"Faisal Hafiz", peran:"Proyek" },
    { nama:"A.A. Sagung Ayu Tirta", peran:"Arsitek" },
    { nama:"Kevin Himawan", peran:"Admin" },
    { nama:"Deby Amalia", peran:"QS" },
    { nama:"Zaky Ramadhan", peran:"Arsitek" },
  ]},
  { no:"2", divisi:"Proyek · Tim B", anggota:[
    { nama:"Risky Dhamayanti Nur Pratiwi", peran:"Proyek" },
    { nama:"Agni Trian Bawono", peran:"Proyek" },
    { nama:"Adrie Prasetyo Nugroho", peran:"Arsitek" },
    { nama:"Melinda Susila Rini", peran:"Adm Proyek" },
    { nama:"Emanuel Christian", peran:"Arsitek" },
  ]},
  { no:"3", divisi:"Markom", anggota:[
    { nama:"Daniel Firmansyah", peran:"Sales & Marketing" },
    { nama:"Andriawan Pranaditya", peran:"Sales & Marketing" },
    { nama:"M Zulfikri Akbar", peran:"Digital Marketing" },
    { nama:"David Beniah Wibowo", peran:"Digital Marketing" },
    { nama:"Elisia", peran:"Digital Marketing" },
  ]},
  { no:"4", divisi:"Support · Finance", anggota:[
    { nama:"Sri Hartati", peran:"Budget" },
    { nama:"Rudy Susanto", peran:"Acct & Tax" },
    { nama:"Agung M Ramdani", peran:"Collection" },
    { nama:"Sugino", peran:"Admin & Finance" },
  ]},
  { no:"5", divisi:"Support · Operasional", anggota:[
    { nama:"Anneke", peran:"Adm Sales" },
    { nama:"Arwan Subekti", peran:"IT" },
    { nama:"Yudi S", peran:"Perijinan" },
    { nama:"Willy S", peran:"Legal" },
  ]},
];
// ============================================================

const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const roster = document.getElementById("roster");

function render(q) {
  q = (q || "").toLowerCase().trim();
  roster.innerHTML = KELOMPOK.map(k => {
    const li = k.anggota.map(a => {
      const cocok = q && a.nama.toLowerCase().includes(q);
      return `<li class="${cocok ? "hit" : ""}"><span class="rn">${esc(a.nama)}</span><span class="rr">${esc(a.peran)}</span></li>`;
    }).join("");
    return `<div class="rcard">
      <div class="rhead"><span class="rno">Kelompok ${esc(k.no)}</span><span class="rdiv">${esc(k.divisi)}</span></div>
      <ol class="rlist">${li}</ol>
    </div>`;
  }).join("");
}
render("");
document.getElementById("cari").addEventListener("input", (e) => render(e.target.value));
</script>
</body>
</html>
